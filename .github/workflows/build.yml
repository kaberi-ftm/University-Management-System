name: Build and Test (Success)

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Compile (no tests)
        run: mvn -B -DskipTests compile

      # 6 unit tests - no Spring, no database
      - name: Run unit tests
        run: mvn -B test -Dtest='UserServiceTest,UserDtoTest'

      # 3 integration test classes - full Spring context + H2
      # demo-fail tests are excluded here, so this workflow ends green
      - name: Run integration tests
        run: mvn -B test -Dtest='*IntegrationTest' -DexcludedGroups=demo-fail

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore
