name: Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:        # lets you press "Run workflow" manually in the Actions tab

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Compile (no tests)
        run: mvn -B -DskipTests compile

      # 6 unit tests (+ 1 demo test that fails on purpose) - no Spring, no database
      - name: Run unit tests
        run: mvn -B test -Dtest='UserServiceTest,UserDtoTest,DemoFailingUnitTest'

      # 3 integration test classes (+ 1 demo test that fails on purpose) - full Spring context + H2
      # if: always() -> still runs when the unit-test step is red, so you see both results
      - name: Run integration tests
        if: always()
        run: mvn -B test -Dtest='*IntegrationTest'

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore
