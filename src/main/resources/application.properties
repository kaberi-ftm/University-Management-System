server.port=8080

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/umsdb}
spring.datasource.username=${DB_USERNAME:ums}
spring.datasource.password=${DB_PASSWORD:ums_pass}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.thymeleaf.cache=false

# Default admin + demo teacher/student created on first start (override with env vars)
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:admin123}
app.seed-demo-users=${SEED_DEMO_USERS:true}
