<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Login')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container narrow">
    <div class="card">
        <h1>Login</h1>
        <div class="alert alert-error" th:if="${param.error}">Invalid username or password.</div>
        <div class="alert alert-success" th:if="${param.logout}">You have been logged out.</div>
        <form th:action="@{/login}" method="post">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" required autofocus>
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>
            <button type="submit" class="btn btn-primary">Login</button>
        </form>
    </div>
</main>
</body>
</html>
