<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${title})}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container narrow">
    <div class="card">
        <h1 th:text="${editing} ? 'Edit ' + ${singular} : 'Add ' + ${singular}">Form</h1>

        <form th:action="@{${action}}" th:object="${user}" method="post">
            <label for="username">Username</label>
            <input type="text" id="username" th:field="*{username}">
            <p class="field-error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></p>

            <label for="password">Password <span class="muted" th:if="${editing}">(leave blank to keep current)</span></label>
            <input type="password" id="password" th:field="*{password}" autocomplete="new-password">
            <p class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>

            <label for="fullName">Full name</label>
            <input type="text" id="fullName" th:field="*{fullName}">
            <p class="field-error" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></p>

            <label for="email">Email</label>
            <input type="text" id="email" th:field="*{email}">
            <p class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>

            <label for="department">Department</label>
            <input type="text" id="department" th:field="*{department}">

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Save</button>
                <a class="btn btn-secondary" th:href="@{${basePath}}">Cancel</a>
            </div>
        </form>
    </div>
</main>
</body>
</html>
